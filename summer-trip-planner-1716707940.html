<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 全方位指令架構師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4F46E5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4F46E5;
        }
        #advanced-section {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <div class="bg-indigo-900 p-8 text-white">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">AI 全方位指令架構師</h1>
                    <p class="text-indigo-200 mt-2">優化目標：<span class="font-semibold text-white border-b border-indigo-400 pb-1">6月出發 4-6日避暑美食之旅規劃 (27度以下)</span></p>
                </div>
                <!-- Mode Toggle -->
                <div class="flex items-center bg-indigo-800 rounded-lg p-1">
                    <button type="button" onclick="setMode('simple')" id="btn-simple" class="px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm">快速評估</button>
                    <button type="button" onclick="setMode('detailed')" id="btn-detailed" class="px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white">深度分析 (20+ 參數)</button>
                </div>
            </div>
        </div>

        <div class="p-8">
            <form id="prompt-form" class="space-y-8">
                
                <!-- SECTION 1: ESSENTIAL (Always Visible) -->
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-indigo-100 text-indigo-700 w-8 h-8 rounded-full flex items-center justify-center text-sm mr-3">1</span>
                        核心參數 (必填)
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">理想目的地類型 🌍</label>
                            <select name="Destination_Preference" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-indigo-500">
                                <option value="日本 (北海道/東北/長野等避暑勝地)">日本 (北海道/東北/長野等避暑勝地)</option>
                                <option value="韓國 (首爾/濟州島)">韓國 (首爾/濟州島)</option>
                                <option value="台灣 (高山地區如清境/阿里山)">台灣 (高山地區如清境/阿里山)</option>
                                <option value="南半球 (澳洲/新西蘭 - 需考慮天數是否足夠)">南半球 (澳洲/新西蘭 - 需考慮天數是否足夠)</option>
                                <option value="中國大陸 (雲南/貴州等高海拔地區)">中國大陸 (雲南/貴州等高海拔地區)</option>
                                <option value="開放建議，只要符合氣溫要求即可">開放建議，只要符合氣溫要求即可</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">確實旅行天數 📅</label>
                            <div class="flex gap-4 mt-2">
                                <label class="inline-flex items-center"><input type="radio" name="Trip_Duration" value="4日3夜" class="text-indigo-600" checked> <span class="ml-2 text-sm">4日3夜</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="Trip_Duration" value="5日4夜" class="text-indigo-600"> <span class="ml-2 text-sm">5日4夜</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="Trip_Duration" value="6日5夜" class="text-indigo-600"> <span class="ml-2 text-sm">6日5夜</span></label>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">預算範圍 (每人/不含機票) 💰</label>
                            <select name="Budget_Per_Person" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-indigo-500">
                                <option value="經濟窮遊 (HKD 3,000 以下)">經濟窮遊 (HKD 3,000 以下)</option>
                                <option value="中等舒適 (HKD 3,000 - 6,000)">中等舒適 (HKD 3,000 - 6,000)</option>
                                <option value="豪華享受 (HKD 6,000 - 10,000)">豪華享受 (HKD 6,000 - 10,000)</option>
                                <option value="無上限 (富豪級)">無上限 (富豪級)</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">同行人數及對象 👥</label>
                            <select name="Travel_Companions" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-indigo-500">
                                <option value="獨遊 (1人)">獨遊 (1人)</option>
                                <option value="情侶/夫妻 (2人)">情侶/夫妻 (2人)</option>
                                <option value="朋友閨蜜 (2-4人)">朋友閨蜜 (2-4人)</option>
                                <option value="家庭 (帶長輩)">家庭 (帶長輩)</option>
                                <option value="家庭 (帶小孩)">家庭 (帶小孩)</option>
                            </select>
                        </div>

                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700">美食偏好 (可多選) 🍣</label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">
                                <label class="inline-flex items-center"><input type="checkbox" name="Food_Preferences" value="海鮮大餐" class="text-indigo-600 rounded"> <span class="ml-2 text-sm">海鮮大餐</span></label>
                                <label class="inline-flex items-center"><input type="checkbox" name="Food_Preferences" value="地道街頭小食" class="text-indigo-600 rounded"> <span class="ml-2 text-sm">地道街頭小食</span></label>
                                <label class="inline-flex items-center"><input type="checkbox" name="Food_Preferences" value="高級餐廳/米芝蓮" class="text-indigo-600 rounded"> <span class="ml-2 text-sm">高級餐廳/米芝蓮</span></label>
                                <label class="inline-flex items-center"><input type="checkbox" name="Food_Preferences" value="打卡Cafe/甜品" class="text-indigo-600 rounded"> <span class="ml-2 text-sm">打卡Cafe/甜品</span></label>
                                <label class="inline-flex items-center"><input type="checkbox" name="Food_Preferences" value="烤肉/火鍋" class="text-indigo-600 rounded"> <span class="ml-2 text-sm">烤肉/火鍋</span></label>
                                <label class="inline-flex items-center"><input type="checkbox" name="Food_Preferences" value="素食友善" class="text-indigo-600 rounded"> <span class="ml-2 text-sm">素食友善</span></label>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- SECTION 2: DEEP DIVE (Hidden by default) -->
                <div id="advanced-section" class="hidden">
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="bg-white px-3 text-sm font-medium text-gray-500">進階詳細設定</span>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-purple-100 text-purple-700 w-8 h-8 rounded-full flex items-center justify-center text-sm mr-3">2</span>
                        深度微調參數 (選填)
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-gray-50 rounded-xl border border-gray-200">
                        
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">行程節奏 🏃‍♂️</label>
                            <div class="flex flex-col gap-2 mt-2">
                                <label class="inline-flex items-center"><input type="radio" name="Travel_Pace" value="極度Chill (每日1-2個景點，睡到自然醒)" class="text-purple-600"> <span class="ml-2 text-sm">極度Chill (每日1-2個景點，睡到自然醒)</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="Travel_Pace" value="適中 (每日3-4個景點，勞逸結合)" class="text-purple-600" checked> <span class="ml-2 text-sm">適中 (每日3-4個景點，勞逸結合)</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="Travel_Pace" value="特種兵 (從早玩到晚，打卡越多越好)" class="text-purple-600"> <span class="ml-2 text-sm">特種兵 (從早玩到晚，打卡越多越好)</span></label>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">氣候具體要求 🌡️</label>
                            <div class="flex flex-col gap-2 mt-2">
                                <label class="inline-flex items-center"><input type="radio" name="Climate_Detail" value="微涼舒適 (20-26度，可穿短袖加薄外套)" class="text-purple-600" checked> <span class="ml-2 text-sm">微涼舒適 (20-26度)</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="Climate_Detail" value="清涼避暑 (15-20度，需穿長袖/外套)" class="text-purple-600"> <span class="ml-2 text-sm">清涼避暑 (15-20度)</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="Climate_Detail" value="寒冷 (15度以下)" class="text-purple-600"> <span class="ml-2 text-sm">寒冷 (15度以下)</span></label>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">交通方式偏好 🚗</label>
                            <select name="Transportation" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500">
                                <option value="全依賴公共交通 (地鐵/巴士)">全依賴公共交通 (地鐵/巴士)</option>
                                <option value="自駕遊 (需安排租車及車位)">自駕遊 (需安排租車及車位)</option>
                                <option value="包車/的士為主">包車/的士為主</option>
                                <option value="混合 (市區公交，郊區包車/自駕)">混合 (市區公交，郊區包車/自駕)</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">住宿偏好 🏨</label>
                            <select name="Accommodation" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500">
                                <option value="連鎖星級酒店 (乾淨方便)">連鎖星級酒店 (乾淨方便)</option>
                                <option value="特色民宿/Airbnb (體驗當地生活)">特色民宿/Airbnb (體驗當地生活)</option>
                                <option value="溫泉旅館/Resort (享受型)">溫泉旅館/Resort (享受型)</option>
                                <option value="青年旅館/膠囊旅館 (極致省錢)">青年旅館/膠囊旅館 (極致省錢)</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">航班偏好 ✈️</label>
                            <select name="Flight_Preference" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500">
                                <option value="早機去晚機返 (玩盡每一分秒)">早機去晚機返 (玩盡每一分秒)</option>
                                <option value="凌晨機 (Red-eye) 節省時間">凌晨機 (Red-eye) 節省時間</option>
                                <option value="無所謂，平機票優先">無所謂，平機票優先</option>
                                <option value="必須直航，不接受轉機">必須直航，不接受轉機</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">購物需求 🛍️</label>
                            <select name="Shopping_Needs" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500">
                                <option value="不需要特別安排購物行程">不需要特別安排購物行程</option>
                                <option value="買手信/特色小店即可">買手信/特色小店即可</option>
                                <option value="需要安排Outlet/大型商場">需要安排Outlet/大型商場</option>
                                <option value="瘋狂血拼 (藥妝/名牌/服飾)">瘋狂血拼 (藥妝/名牌/服飾)</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">晚間活動 🌙</label>
                            <select name="Nightlife" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500">
                                <option value="回酒店休息">回酒店休息</option>
                                <option value="行夜市/掃街">行夜市/掃街</option>
                                <option value="居酒屋/酒吧/夜生活">居酒屋/酒吧/夜生活</option>
                                <option value="看夜景/晚間表演">看夜景/晚間表演</option>
                            </select>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">簽證狀況 🛂</label>
                            <select name="Visa_Status" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500">
                                <option value="只限特區護照/BNO免簽國家">只限特區護照/BNO免簽國家</option>
                                <option value="不介意辦理電子簽證 (如K-ETA, ETA)">不介意辦理電子簽證 (如K-ETA, ETA)</option>
                                <option value="已有各國簽證/不介意辦理實體簽證">已有各國簽證/不介意辦理實體簽證</option>
                            </select>
                        </div>

                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700">其他特殊需求 / 備註 📝</label>
                            <textarea name="Special_Requirements" rows="3" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500" placeholder="例如：有人暈車浪、需要輪椅通道、想去某個特定景點打卡..."></textarea>
                        </div>

                    </div>
                </div>

            </form>

            <!-- Action Buttons -->
            <div class="mt-10 pt-6 border-t border-gray-100 flex flex-col sm:flex-row gap-4">
                <button type="button" onclick="handleAction('share')" class="flex-1 flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-lg transform active:scale-98">
                    手機分享
                </button>
                <button type="button" onclick="handleAction('copy')" class="flex-1 flex items-center justify-center bg-white hover:bg-gray-50 text-gray-700 font-bold py-4 px-6 rounded-xl border-2 border-gray-200 transition transform active:scale-98">
                    結構化複製
                </button>
                <button type="button" onclick="handleAction('narrative')" class="flex-1 flex items-center justify-center bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-lg transform active:scale-98">
                    轉為敘述並複製
                </button>
            </div>

            <!-- 終極保險：結果顯示框 (預設隱藏，撳掣後顯示) -->
            <div id="result-box" class="hidden mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-inner">
                <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <span>✨ 生成結果</span>
                    <span class="ml-2 text-xs font-normal text-gray-500">(如無法自動複製，請手動全選下方文字)</span>
                </h3>
                <textarea id="final-prompt-text" class="w-full h-64 p-4 text-sm font-mono text-gray-800 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // Mode Switching Logic
        function setMode(mode) {
            const advancedSection = document.getElementById('advanced-section');
            const btnSimple = document.getElementById('btn-simple');
            const btnDetailed = document.getElementById('btn-detailed');

            if (mode === 'simple') {
                advancedSection.classList.add('hidden');
                btnSimple.className = "px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm";
                btnDetailed.className = "px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white";
            } else {
                advancedSection.classList.remove('hidden');
                btnSimple.className = "px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white";
                btnDetailed.className = "px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm";
            }
        }

        function generatePrompt() {
            const form = document.getElementById('prompt-form');
            const formData = new FormData(form);
            let contextParts = [];
            const baseRequest = "6月出發 4-6日避暑美食之旅規劃 (27度以下)";
            
            for (let [key, value] of formData.entries()) {
                if(value && value.trim() !== "") {
                    let readableKey = key.replace(/_/g, ' ');
                    contextParts.push(`### ${readableKey}\n${value}`);
                }
            }

            return `
# 🚀 Expert Prompt Request
**Task**: ${baseRequest}

---
## 📋 Context & Requirements
The following details define the scope and style of the response:

${contextParts.join('\n\n')}

---
## 🎯 Output Instruction
Please act as a world-class travel planner. Analyze the requirements above and provide a comprehensive, day-by-day itinerary that strictly adheres to the constraints (especially the weather constraint of being under 27°C) and preferences specified. Include food recommendations and logistical tips.
`.trim();
        }

        async function handleAction(type) {
            let promptText = "";
            const baseRequest = "6月出發 4-6日避暑美食之旅規劃 (27度以下)";
            const resultBox = document.getElementById('result-box');
            const finalPromptText = document.getElementById('final-prompt-text');
            
            if (type === 'narrative') {
                const form = document.getElementById('prompt-form');
                const formData = new FormData(form);
                let details = [];
                
                for (let [key, value] of formData.entries()) {
                    if(value && value.trim() !== "") {
                        let readableKey = key.replace(/_/g, ' ');
                        details.push(`關於「${readableKey}」請設定為「${value}」`);
                    }
                }
                
                promptText = baseRequest;
                if(details.length > 0) {
                    promptText += `\n並參考以下條件：\n${details.join('；\n')}。`;
                }
            } else {
                promptText = generatePrompt();
            }

            finalPromptText.value = promptText;
            resultBox.classList.remove('hidden');

            if (type === 'share') {
                if (navigator.share) {
                    try { 
                        await navigator.share({ 
                            title: 'Super Prompt', 
                            text: promptText 
                        }); 
                    } catch (err) { 
                        console.log('分享已取消或失敗', err); 
                    }
                } else {
                    alert('你的瀏覽器暫時不支援原生分享，請直接複製下方文字框內容。');
                }
            } else {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(promptText);
                        alert(type === 'narrative' ? '✅ 敘述型條件已成功複製！' : '✅ 結構化 Prompt 已成功複製！');
                    } else {
                        finalPromptText.select();
                        document.execCommand('copy');
                        alert(type === 'narrative' ? '✅ 敘述型條件已成功複製！' : '✅ 結構化 Prompt 已成功複製！');
                    }
                } catch (err) {
                    alert('⚠️ 自動複製被瀏覽器阻擋，請手動長按下方文字框進行複製。');
                    console.error('複製失敗:', err);
                }
            }
        }
    </script>
</body>
</html>
