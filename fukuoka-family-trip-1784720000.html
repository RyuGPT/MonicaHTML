<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 全方位指令架構師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4F46E5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4F46E5;
        }
        #advanced-section {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <div class="bg-indigo-900 p-8 text-white">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">AI 全方位指令架構師</h1>
                    <p class="text-indigo-200 mt-2">優化目標：<span class="font-semibold text-white border-b border-indigo-400 pb-1">8/17-8/22 福岡 6天5夜 早去晚返 (8-10歲男女童) 行程規劃</span></p>
                </div>
                <!-- Mode Toggle -->
                <div class="flex items-center bg-indigo-800 rounded-lg p-1">
                    <button type="button" onclick="setMode('simple')" id="btn-simple" class="px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm">快速評估</button>
                    <button type="button" onclick="setMode('detailed')" id="btn-detailed" class="px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white">深度分析 (20+ 參數)</button>
                </div>
            </div>
        </div>

        <div class="p-8">
            <form id="prompt-form" class="space-y-8">
                
                <!-- SECTION 1: ESSENTIAL (Always Visible) -->
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-indigo-100 text-indigo-700 w-8 h-8 rounded-full flex items-center justify-center text-sm mr-3">1</span>
                        核心參數 (必填)
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- 1. 交通方式 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">主要交通方式</label>
                            <select name="Transportation" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="全程大眾運輸 (JR/地鐵/巴士)">全程大眾運輸 (JR/地鐵/巴士)</option>
                                <option value="全程自駕租車">全程自駕租車</option>
                                <option value="市區大眾運輸 + 郊區自駕/包車">市區大眾運輸 + 郊區自駕/包車</option>
                                <option value="以的士/Uber輔助大眾運輸">以的士/Uber輔助大眾運輸</option>
                            </select>
                        </div>

                        <!-- 2. 行程節奏 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">每日行程節奏</label>
                            <select name="Pacing" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="輕鬆悠閒 (每日1-2個主要景點，保留午睡/休息時間)">輕鬆悠閒 (每日1-2個主要景點，保留休息時間)</option>
                                <option value="適中平衡 (每日2-3個景點，早出傍晚歸)">適中平衡 (每日2-3個景點，早出傍晚歸)</option>
                                <option value="充實緊湊 (盡量多看多玩，不怕行路)">充實緊湊 (盡量多看多玩，不怕行路)</option>
                            </select>
                        </div>

                        <!-- 3. 小朋友興趣 -->
                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700">小朋友主要興趣 (可多選)</label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Kids_Interests" value="主題樂園/遊樂場" class="rounded text-indigo-600 focus:ring-indigo-500"> <span class="text-sm text-gray-700">主題樂園</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Kids_Interests" value="動物園/水族館" class="rounded text-indigo-600 focus:ring-indigo-500"> <span class="text-sm text-gray-700">動物/水族館</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Kids_Interests" value="大自然/公園放電" class="rounded text-indigo-600 focus:ring-indigo-500"> <span class="text-sm text-gray-700">公園放電</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Kids_Interests" value="科學館/博物館" class="rounded text-indigo-600 focus:ring-indigo-500"> <span class="text-sm text-gray-700">科學/博物館</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Kids_Interests" value="動漫/扭蛋/玩具" class="rounded text-indigo-600 focus:ring-indigo-500"> <span class="text-sm text-gray-700">動漫/玩具</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Kids_Interests" value="手作DIY體驗" class="rounded text-indigo-600 focus:ring-indigo-500"> <span class="text-sm text-gray-700">手作體驗</span></label>
                            </div>
                        </div>

                        <!-- 4. 住宿安排 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">住宿安排策略</label>
                            <select name="Accommodation_Strategy" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="固定同一間酒店 (免搬行李)">固定同一間酒店 (免搬行李)</option>
                                <option value="市區與郊區(如由布院/別府)各住幾晚">市區與郊區溫泉各住幾晚</option>
                                <option value="每日隨行程換酒店">每日隨行程換酒店</option>
                            </select>
                        </div>

                        <!-- 5. 預算範圍 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">整體預算風格 (不含機票)</label>
                            <select name="Budget_Style" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="經濟實惠 (平價美食、免費/平價景點為主)">經濟實惠 (平價美食、平價景點為主)</option>
                                <option value="中等舒適 (該花就花，偶爾食大餐)">中等舒適 (該花就花，偶爾食大餐)</option>
                                <option value="豪華享受 (高級溫泉旅館、和牛/海鮮大餐)">豪華享受 (高級溫泉旅館、和牛大餐)</option>
                            </select>
                        </div>

                    </div>
                </div>

                <!-- SECTION 2: DEEP DIVE (Hidden by default) -->
                <div id="advanced-section" class="hidden">
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="bg-white px-3 text-sm font-medium text-gray-500">進階詳細設定</span>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-purple-100 text-purple-700 w-8 h-8 rounded-full flex items-center justify-center text-sm mr-3">2</span>
                        深度微調參數 (選填)
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-gray-50 rounded-xl border border-gray-200">
                        
                        <!-- 6. 飲食偏好 -->
                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700">飲食偏好與禁忌</label>
                            <textarea name="Dietary_Preferences" rows="2" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：小朋友不吃辣、一定要有白飯、有人對海鮮過敏..."></textarea>
                        </div>

                        <!-- 7. 必去景點 -->
                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700">已決定的必去景點/餐廳</label>
                            <textarea name="Must_Visit_Spots" rows="2" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：太宰府、麵包超人博物館、由布院之森列車..."></textarea>
                        </div>

                        <!-- 8. 大人購物需求 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">大人購物需求</label>
                            <select name="Shopping_Needs" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="極低 (純觀光不購物)">極低 (純觀光不購物)</option>
                                <option value="中等 (順路逛藥妝/超市/手信)">中等 (順路逛藥妝/超市/手信)</option>
                                <option value="高 (需安排Outlet或百貨公司專門購物時間)">高 (需安排Outlet/百貨專門時間)</option>
                            </select>
                        </div>

                        <!-- 9. 雨天備案 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">雨天備案偏好</label>
                            <select name="Rainy_Day_Backup" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="室內遊樂場/博物館">室內遊樂場/博物館</option>
                                <option value="大型商場/地下街連通景點">大型商場/地下街連通景點</option>
                                <option value="照常戶外行程 (準備雨具)">照常戶外行程 (準備雨具)</option>
                            </select>
                        </div>

                        <!-- 10. 晚餐安排 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">晚餐與夜間活動</label>
                            <select name="Evening_Plans" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="早早食完回酒店休息">早早食完回酒店休息 (適合小朋友作息)</option>
                                <option value="晚餐後逛逛超市/附近商圈">晚餐後逛逛超市/附近商圈</option>
                                <option value="安排夜間景點 (如福岡塔夜景、屋台體驗)">安排夜間景點 (如福岡塔夜景、屋台)</option>
                            </select>
                        </div>

                        <!-- 11. 輸出格式 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">行程表輸出格式</label>
                            <select name="Output_Format" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="表格形式 (包含時間、地點、交通、備註)">表格形式 (包含時間、地點、交通、備註)</option>
                                <option value="條列式敘述 (詳細說明每個景點特色與注意事項)">條列式敘述 (詳細說明特色與注意事項)</option>
                                <option value="心智圖/大綱結構">大綱結構 (簡潔明瞭)</option>
                            </select>
                        </div>

                    </div>
                </div>

            </form>

            <!-- Action Buttons -->
            <div class="mt-10 pt-6 border-t border-gray-100 flex flex-col sm:flex-row gap-4">
                <button type="button" onclick="handleAction('share')" class="flex-1 flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-lg transform active:scale-98">
                    手機分享
                </button>
                <button type="button" onclick="handleAction('copy')" class="flex-1 flex items-center justify-center bg-white hover:bg-gray-50 text-gray-700 font-bold py-4 px-6 rounded-xl border-2 border-gray-200 transition transform active:scale-98">
                    結構化複製
                </button>
                <button type="button" onclick="handleAction('narrative')" class="flex-1 flex items-center justify-center bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-lg transform active:scale-98">
                    轉為敘述並複製
                </button>
            </div>

            <!-- 終極保險：結果顯示框 (預設隱藏，撳掣後顯示) -->
            <div id="result-box" class="hidden mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-inner">
                <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <span>✨ 生成結果</span>
                    <span class="ml-2 text-xs font-normal text-gray-500">(如無法自動複製，請手動全選下方文字)</span>
                </h3>
                <textarea id="final-prompt-text" class="w-full h-64 p-4 text-sm font-mono text-gray-800 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // Mode Switching Logic
        function setMode(mode) {
            const advancedSection = document.getElementById('advanced-section');
            const btnSimple = document.getElementById('btn-simple');
            const btnDetailed = document.getElementById('btn-detailed');

            if (mode === 'simple') {
                advancedSection.classList.add('hidden');
                btnSimple.className = "px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm";
                btnDetailed.className = "px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white";
            } else {
                advancedSection.classList.remove('hidden');
                btnSimple.className = "px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white";
                btnDetailed.className = "px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm";
            }
        }

        function generatePrompt() {
            const form = document.getElementById('prompt-form');
            const formData = new FormData(form);
            let contextParts = [];
            const baseRequest = "8/17-8/22 福岡 6天5夜 早去晚返 (8-10歲男女童) 行程規劃";
            
            for (let [key, value] of formData.entries()) {
                if(value && value.trim() !== "") {
                    let readableKey = key.replace(/_/g, ' ');
                    contextParts.push(`### ${readableKey}\n${value}`);
                }
            }

            return `
# 🚀 Expert Prompt Request
**Task**: ${baseRequest}

---
## 📋 Context & Requirements
The following details define the scope and style of the response:

${contextParts.join('\n\n')}

---
## 🎯 Output Instruction
Please act as a world-class expert in family travel planning. Analyze the requirements above and provide a comprehensive, high-quality 6-day itinerary for Fukuoka that strictly adheres to the constraints and tone specified. Ensure the pacing is suitable for 8-10 year old children.
`.trim();
        }

        async function handleAction(type) {
            let promptText = "";
            const baseRequest = "8/17-8/22 福岡 6天5夜 早去晚返 (8-10歲男女童) 行程規劃";
            const resultBox = document.getElementById('result-box');
            const finalPromptText = document.getElementById('final-prompt-text');
            
            // 1. 準備要複製/分享嘅文字
            if (type === 'narrative') {
                const form = document.getElementById('prompt-form');
                const formData = new FormData(form);
                let details = [];
                
                // Handle multiple checkboxes for Kids_Interests
                let interests = [];
                for (let [key, value] of formData.entries()) {
                    if(key === 'Kids_Interests') {
                        interests.push(value);
                    } else if(value && value.trim() !== "") {
                        let readableKey = key.replace(/_/g, ' ');
                        details.push(`關於「${readableKey}」請設定為「${value}」`);
                    }
                }
                if (interests.length > 0) {
                    details.push(`關於「小朋友主要興趣」請設定為「${interests.join('、')}」`);
                }
                
                promptText = baseRequest;
                if(details.length > 0) {
                    promptText += `\n請參考以下條件：\n${details.join('；\n')}。`;
                }
            } else {
                promptText = generatePrompt();
            }

            // 2. 顯示結果框 (雙重保險)
            finalPromptText.value = promptText;
            resultBox.classList.remove('hidden');

            // 3. 執行動作
            if (type === 'share') {
                if (navigator.share) {
                    try { 
                        await navigator.share({ 
                            title: 'Super Prompt', 
                            text: promptText 
                        }); 
                    } catch (err) { 
                        console.log('分享已取消或失敗', err); 
                    }
                } else {
                    alert('你的瀏覽器暫時不支援原生分享，請直接複製下方文字框內容。');
                }
            } else {
                // 嘗試複製
                try {
                    // 新版 API
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(promptText);
                        alert(type === 'narrative' ? '✅ 敘述型條件已成功複製！' : '✅ 結構化 Prompt 已成功複製！');
                    } else {
                        // 舊版 Fallback
                        finalPromptText.select();
                        document.execCommand('copy');
                        alert(type === 'narrative' ? '✅ 敘述型條件已成功複製！' : '✅ 結構化 Prompt 已成功複製！');
                    }
                } catch (err) {
                    alert('⚠️ 自動複製被瀏覽器阻擋，請手動長按下方文字框進行複製。');
                    console.error('複製失敗:', err);
                }
            }
        }
    </script>
</body>
</html>
