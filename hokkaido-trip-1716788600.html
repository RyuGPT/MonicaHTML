<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 全方位指令架構師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4F46E5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4F46E5;
        }
        #advanced-section {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <div class="bg-indigo-900 p-8 text-white">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">AI 全方位指令架構師</h1>
                    <p class="text-indigo-200 mt-2">優化目標：<span class="font-semibold text-white border-b border-indigo-400 pb-1">北海道 6月7-13 旅行，要有玩，食好</span></p>
                </div>
                <!-- Mode Toggle -->
                <div class="flex items-center bg-indigo-800 rounded-lg p-1">
                    <button type="button" onclick="setMode('simple')" id="btn-simple" class="px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm">快速評估</button>
                    <button type="button" onclick="setMode('detailed')" id="btn-detailed" class="px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white">深度分析 (20+ 參數)</button>
                </div>
            </div>
        </div>

        <div class="p-8">
            <form id="prompt-form" class="space-y-8">
                
                <!-- SECTION 1: ESSENTIAL (Always Visible) -->
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-indigo-100 text-indigo-700 w-8 h-8 rounded-full flex items-center justify-center text-sm mr-3">1</span>
                        核心參數 (必填)
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- 1. 同行旅伴 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">同行旅伴</label>
                            <select name="Group_Composition" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="獨自旅行">獨自旅行</option>
                                <option value="情侶/夫妻">情侶/夫妻</option>
                                <option value="朋友同行">朋友同行</option>
                                <option value="親子家庭 (有小孩)">親子家庭 (有小孩)</option>
                                <option value="帶長輩出遊">帶長輩出遊</option>
                            </select>
                        </div>

                        <!-- 2. 主要交通方式 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">主要交通方式</label>
                            <select name="Transportation_Mode" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="全程自駕">全程自駕</option>
                                <option value="大眾運輸 (JR/巴士)">大眾運輸 (JR/巴士)</option>
                                <option value="包車">包車</option>
                                <option value="混合 (部分自駕/部分大眾運輸)">混合 (部分自駕/部分大眾運輸)</option>
                            </select>
                        </div>

                        <!-- 3. 預算等級 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">預算等級 (不含機票)</label>
                            <select name="Budget_Level" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="小資窮遊 (著重CP值)">小資窮遊 (著重CP值)</option>
                                <option value="中等舒適 (該花就花)">中等舒適 (該花就花)</option>
                                <option value="奢華享受 (無預算上限)">奢華享受 (無預算上限)</option>
                            </select>
                        </div>

                        <!-- 4. 必吃美食種類 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">必吃美食種類 (可複選)</label>
                            <div class="grid grid-cols-2 gap-2 text-sm">
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Food_Preferences" value="海鮮/螃蟹" class="rounded text-indigo-600"> <span>海鮮/螃蟹</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Food_Preferences" value="成吉思汗烤肉" class="rounded text-indigo-600"> <span>成吉思汗烤肉</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Food_Preferences" value="湯咖哩/拉麵" class="rounded text-indigo-600"> <span>湯咖哩/拉麵</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Food_Preferences" value="甜點/哈密瓜" class="rounded text-indigo-600"> <span>甜點/哈密瓜</span></label>
                            </div>
                        </div>

                        <!-- 5. 進出機場 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">進出機場</label>
                            <select name="Airports" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="新千歲進出 (札幌)">新千歲進出 (札幌)</option>
                                <option value="函館進出">函館進出</option>
                                <option value="新千歲進、函館出 (或反之)">新千歲進、函館出 (或反之)</option>
                                <option value="旭川進出">旭川進出</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2: DEEP DIVE (Hidden by default) -->
                <div id="advanced-section" class="hidden">
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="bg-white px-3 text-sm font-medium text-gray-500">進階詳細設定</span>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-purple-100 text-purple-700 w-8 h-8 rounded-full flex items-center justify-center text-sm mr-3">2</span>
                        深度微調參數 (選填)
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-gray-50 rounded-xl border border-gray-200">
                        <!-- 6. 旅行風格 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">旅行風格</label>
                            <select name="Travel_Style" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="輕鬆度假 (睡到自然醒)">輕鬆度假 (睡到自然醒)</option>
                                <option value="充實打卡 (行程排滿)">充實打卡 (行程排滿)</option>
                                <option value="深度體驗 (在地文化)">深度體驗 (在地文化)</option>
                            </select>
                        </div>

                        <!-- 7. 住宿偏好 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">住宿偏好</label>
                            <select name="Accommodation_Type" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="溫泉旅館 (一泊二食)">溫泉旅館 (一泊二食)</option>
                                <option value="市區商務旅館">市區商務旅館</option>
                                <option value="特色民宿/Airbnb">特色民宿/Airbnb</option>
                                <option value="星級度假村">星級度假村</option>
                            </select>
                        </div>

                        <!-- 8. 活動重點 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">活動重點</label>
                            <div class="grid grid-cols-2 gap-2 text-sm">
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Activity_Focus" value="自然風光" class="rounded text-indigo-600"> <span>自然風光</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Activity_Focus" value="逛街購物" class="rounded text-indigo-600"> <span>逛街購物</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Activity_Focus" value="歷史人文" class="rounded text-indigo-600"> <span>歷史人文</span></label>
                                <label class="flex items-center space-x-2"><input type="checkbox" name="Activity_Focus" value="主題樂園/動物園" class="rounded text-indigo-600"> <span>主題樂園/動物園</span></label>
                            </div>
                        </div>

                        <!-- 9. 行程節奏 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">每日景點數量 (行程節奏)</label>
                            <select name="Pacing" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="1-2個 (極度放鬆)">1-2個 (極度放鬆)</option>
                                <option value="3-4個 (適中)">3-4個 (適中)</option>
                                <option value="5個以上 (行軍式)">5個以上 (行軍式)</option>
                            </select>
                        </div>

                        <!-- 10. 必去景點 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">指定必去景點</label>
                            <textarea name="Must_Visit_Spots" rows="2" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：旭山動物園、小樽運河、富田農場..."></textarea>
                        </div>

                        <!-- 11. 飲食禁忌 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">飲食禁忌</label>
                            <input type="text" name="Dietary_Restrictions" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：不吃生食、素食、對甲殼類過敏...">
                        </div>

                        <!-- 12. 夜間活動 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">夜間活動偏好</label>
                            <select name="Evening_Activities" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="居酒屋/酒吧小酌">居酒屋/酒吧小酌</option>
                                <option value="看百萬夜景 (如函館山)">看百萬夜景 (如函館山)</option>
                                <option value="逛狸小路/驚安殿堂">逛狸小路/驚安殿堂</option>
                                <option value="回飯店泡湯休息">回飯店泡湯休息</option>
                            </select>
                        </div>

                        <!-- 13. 購物需求 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">購物需求</label>
                            <select name="Shopping_Preferences" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="Outlet 大採購">Outlet 大採購</option>
                                <option value="在地市場/伴手禮">在地市場/伴手禮</option>
                                <option value="藥妝/電器">藥妝/電器</option>
                                <option value="不愛購物">不愛購物</option>
                            </select>
                        </div>

                        <!-- 14. 拍照需求 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">拍照需求</label>
                            <select name="Photography_Needs" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇...</option>
                                <option value="網美打卡熱點">網美打卡熱點</option>
                                <option value="專業風景攝影">專業風景攝影</option>
                                <option value="隨意紀錄即可">隨意紀錄即可</option>
                            </select>
                        </div>

                        <!-- 15. 雨天備案需求 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-gray-700">雨天備案需求</label>
                            <div class="flex space-x-4 mt-2">
                                <label class="flex items-center space-x-2"><input type="radio" name="Weather_Contingency" value="需要" class="text-indigo-600"> <span>需要</span></label>
                                <label class="flex items-center space-x-2"><input type="radio" name="Weather_Contingency" value="不需要" class="text-indigo-600"> <span>不需要</span></label>
                            </div>
                        </div>
                    </div>
                </div>

            </form>

            <!-- Action Buttons -->
            <div class="mt-10 pt-6 border-t border-gray-100 flex flex-col sm:flex-row gap-4">
                <button type="button" onclick="handleAction('share')" class="flex-1 flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-lg transform active:scale-98">
                    手機分享
                </button>
                <button type="button" onclick="handleAction('copy')" class="flex-1 flex items-center justify-center bg-white hover:bg-gray-50 text-gray-700 font-bold py-4 px-6 rounded-xl border-2 border-gray-200 transition transform active:scale-98">
                    結構化複製
                </button>
                <button type="button" onclick="handleAction('narrative')" class="flex-1 flex items-center justify-center bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-lg transform active:scale-98">
                    轉為敘述並複製
                </button>
            </div>

            <!-- 終極保險：結果顯示框 (預設隱藏，撳掣後顯示) -->
            <div id="result-box" class="hidden mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-inner">
                <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <span>✨ 生成結果</span>
                    <span class="ml-2 text-xs font-normal text-gray-500">(如無法自動複製，請手動全選下方文字)</span>
                </h3>
                <textarea id="final-prompt-text" class="w-full h-64 p-4 text-sm font-mono text-gray-800 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // Mode Switching Logic
        function setMode(mode) {
            const advancedSection = document.getElementById('advanced-section');
            const btnSimple = document.getElementById('btn-simple');
            const btnDetailed = document.getElementById('btn-detailed');

            if (mode === 'simple') {
                advancedSection.classList.add('hidden');
                btnSimple.className = "px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm";
                btnDetailed.className = "px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white";
            } else {
                advancedSection.classList.remove('hidden');
                btnSimple.className = "px-4 py-2 rounded-md text-sm font-medium transition-all text-indigo-200 hover:text-white";
                btnDetailed.className = "px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-indigo-900 shadow-sm";
            }
        }

        function generatePrompt() {
            const form = document.getElementById('prompt-form');
            const formData = new FormData(form);
            let contextParts = [];
            const baseRequest = "北海道 6月7-13 旅行，要有玩，食好";
            
            for (let [key, value] of formData.entries()) {
                if(value && value.trim() !== "") {
                    let readableKey = key.replace(/_/g, ' ');
                    contextParts.push(`### ${readableKey}\n${value}`);
                }
            }

            return `
# 🚀 Expert Prompt Request
**Task**: ${baseRequest}

---
## 📋 Context & Requirements
The following details define the scope and style of the response:

${contextParts.join('\n\n')}

---
## 🎯 Output Instruction
Please act as a world-class expert in this field. Analyze the requirements above and provide a comprehensive, high-quality response that strictly adheres to the constraints and tone specified.
`.trim();
        }

        async function handleAction(type) {
            let promptText = "";
            const baseRequest = "北海道 6月7-13 旅行，要有玩，食好";
            const resultBox = document.getElementById('result-box');
            const finalPromptText = document.getElementById('final-prompt-text');
            
            // 1. 準備要複製/分享嘅文字
            if (type === 'narrative') {
                const form = document.getElementById('prompt-form');
                const formData = new FormData(form);
                let details = [];
                
                for (let [key, value] of formData.entries()) {
                    if(value && value.trim() !== "") {
                        let readableKey = key.replace(/_/g, ' ');
                        details.push(`關於「${readableKey}」請設定為「${value}」`);
                    }
                }
                
                promptText = baseRequest;
                if(details.length > 0) {
                    promptText += `並參考以下條件：\n${details.join('；\n')}。`;
                }
            } else {
                promptText = generatePrompt();
            }

            // 2. 顯示結果框 (雙重保險)
            finalPromptText.value = promptText;
            resultBox.classList.remove('hidden');

            // 3. 執行動作
            if (type === 'share') {
                if (navigator.share) {
                    try { 
                        await navigator.share({ 
                            title: 'Super Prompt', 
                            text: promptText 
                        }); 
                    } catch (err) { 
                        console.log('分享已取消或失敗', err); 
                    }
                } else {
                    alert('你的瀏覽器暫時不支援原生分享，請直接複製下方文字框內容。');
                }
            } else {
                // 嘗試複製
                try {
                    // 新版 API
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(promptText);
                        alert(type === 'narrative' ? '✅ 敘述型條件已成功複製！' : '✅ 結構化 Prompt 已成功複製！');
                    } else {
                        // 舊版 Fallback
                        finalPromptText.select();
                        document.execCommand('copy');
                        alert(type === 'narrative' ? '✅ 敘述型條件已成功複製！' : '✅ 結構化 Prompt 已成功複製！');
                    }
                } catch (err) {
                    alert('⚠️ 自動複製被瀏覽器阻擋，請手動長按下方文字框進行複製。');
                    console.error('複製失敗:', err);
                }
            }
        }
    </script>
</body>
</html>
